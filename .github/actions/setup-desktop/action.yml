name: Setup DJL desktop dependencies
description: Install the pinned Node and Bun runtimes with a frozen dependency graph.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: package.json

    - name: Cache Bun downloads
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

    - name: Install dependencies from the lockfile
      shell: bash
      run: bun install --frozen-lockfile --backend=copyfile --concurrent-scripts=1
