name: Landing Deploy

# The landing site is served by Vercel from Anthonysu798/DJL_landing_website, but this monorepo is
# where it is edited. This workflow keeps that deployment repository a mirror of apps/landing so a
# merge to main is all it takes to ship the site. It is deliberately separate from Desktop CI, which
# must keep testing only the desktop product.

on:
  push:
    branches:
      - main
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DEPLOYMENT_REPOSITORY: Anthonysu798/DJL_landing_website

jobs:
  deploy:
    name: Verify and mirror landing site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      # `next build` type-checks the whole app, so a broken site never reaches the deployment
      # repository. ESLint is intentionally not a gate here: the landing config pulls
      # eslint-plugin-react 7.x, which crashes on the ESLint 10 this workspace hoists.
      - name: Test landing routes
        run: bunx vitest run --root apps/landing

      - name: Build landing site
        run: bun run --cwd apps/landing build

      - name: Mirror apps/landing to the deployment repository
        env:
          MIRROR_TOKEN: ${{ secrets.LANDING_MIRROR_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${MIRROR_TOKEN:-}" ]]; then
            echo "::warning::LANDING_MIRROR_TOKEN is not configured, so the landing site was verified but not deployed."
            {
              echo "### Landing site not deployed"
              echo
              echo "The build and tests passed, but \`LANDING_MIRROR_TOKEN\` is missing so"
              echo "\`$DEPLOYMENT_REPOSITORY\` was not updated. Add a fine-grained token with"
              echo "Contents: read and write on that repository to enable automatic deploys."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Authenticate through gh's credential helper rather than embedding the token in the
          # remote URL: it keeps the token out of every remote/log line, and it works for both
          # fine-grained PATs and app tokens, which disagree on the accepted URL username.
          export GH_TOKEN="$MIRROR_TOKEN"
          if ! gh api "repos/$DEPLOYMENT_REPOSITORY" --jq '.permissions.push' | grep -qx true; then
            echo "::error::LANDING_MIRROR_TOKEN cannot push to $DEPLOYMENT_REPOSITORY. It needs Contents: read and write on that repository."
            exit 1
          fi
          gh auth setup-git --hostname github.com

          git clone --depth 1 \
            "https://github.com/$DEPLOYMENT_REPOSITORY.git" \
            deployment-repository

          # --delete keeps the mirror an exact copy: files removed here are removed there too.
          rsync --archive --delete --exclude '.git/' apps/landing/ deployment-repository/

          cd deployment-repository
          # Vercel blocks deployments whose git author it cannot link to an account member, so the
          # mirror must commit as the repository owner. A bot identity here produces a successful
          # push and a "Deployment was blocked" status, which looks like a build failure but is not.
          git config user.name "Anthony Su"
          git config user.email "Anthonysu798@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "Deployment repository already matches apps/landing."
              exit 0
            fi
            # Manual dispatch doubles as "redeploy the current site", which is how you recover from
            # a Vercel-side failure without inventing a content change.
            git commit --allow-empty --message "chore: redeploy apps/landing from $SOURCE_COMMIT"
          else
            git commit --message "chore: mirror apps/landing from $SOURCE_COMMIT"
          fi
          git push origin HEAD:main
          echo "Mirrored apps/landing to $DEPLOYMENT_REPOSITORY; Vercel will deploy it." \
            >> "$GITHUB_STEP_SUMMARY"
