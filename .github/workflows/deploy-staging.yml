name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy staging
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Apply migrations, policies, and seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          bun run db:migrate
          sudo apt-get install -y -q postgresql-client >/dev/null
          bash infra/scripts/apply-policies.sh
          bun run db:seed
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        run: flyctl deploy --config infra/fly/api.toml --app djl-api-staging --build-arg DJL_VERSION=${{ github.sha }} --remote-only
      - name: Deploy worker
        run: flyctl deploy --config infra/fly/worker.toml --app djl-worker-staging --build-arg DJL_VERSION=${{ github.sha }} --remote-only
      - name: Smoke
        run: |
          curl --fail --silent --show-error https://djl-api-staging.fly.dev/health
          curl --fail --silent --show-error https://djl-api-staging.fly.dev/ready
