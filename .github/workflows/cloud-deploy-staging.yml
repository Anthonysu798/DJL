name: Cloud deploy staging

on:
  # Runs after a successful Cloud CI run on main, so the CI record for the
  # commit is the same one the production deploy later verifies.
  workflow_run:
    workflows: ["Cloud CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-deploy-staging
  cancel-in-progress: false

jobs:
  # Staging infrastructure is provisioned by hand once. Until its secrets exist,
  # the deploy job is skipped instead of failing every push to main.
  preflight:
    name: Staging secrets present
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_HOST: ${{ secrets.STAGING_VPS_HOST != '' }}
          HAS_KEY: ${{ secrets.STAGING_VPS_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.STAGING_VPS_KNOWN_HOSTS != '' }}
        run: |
          if [ "$HAS_HOST" = "true" ] && [ "$HAS_KEY" = "true" ] && [ "$HAS_KNOWN_HOSTS" = "true" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::staging secrets not configured; skipping deploy"; fi

  deploy:
    name: Migrate and deploy staging
    needs: [preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    env:
      VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.STAGING_VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.STAGING_VPS_KNOWN_HOSTS }}
      VPS_ROOT: /srv/djl-cloud-staging
      DJL_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require successful Cloud CI for the exact deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow "Cloud CI" --commit "$(git rev-parse HEAD)" --json conclusion --jq '.[0].conclusion // "none"')
          test "$conclusion" = "success" || { echo "Cloud CI for this commit is $conclusion"; exit 1; }
      - name: Back up, migrate, deploy, and verify VPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash cloud/infra/vps/deploy.sh
