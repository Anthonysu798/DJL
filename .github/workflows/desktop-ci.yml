name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Check scoped formatting
        run: bun run ci:desktop:format

      - name: Lint desktop closure
        run: bun run ci:desktop:lint

      - name: Typecheck desktop closure
        run: bun run ci:desktop:typecheck

  desktop-tests:
    name: Desktop unit and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Install video decoding tools for media integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run desktop unit and contract tests
        run: bun run ci:desktop:test

  renderer-tests:
    name: Chromium renderer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Install Chromium
        run: bun run --cwd apps/web test:browser:install

      - name: Run Chromium renderer tests
        run: bun run ci:desktop:browser

  release-audit:
    name: Release, security, and public-source audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Setup pinned ossutil
        uses: ./.github/actions/setup-ossutil

      - name: Verify Hong Kong OSS mirror command in dry-run mode
        env:
          OSS_ACCESS_KEY_ID: test-only
          OSS_ACCESS_KEY_SECRET: test-only
          OSS_BUCKET: djl-china-releases
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
          OSS_REGION: cn-hongkong
        run: |
          ossutil cp README.md \
            "oss://$OSS_BUCKET/ci-dry-run/README.md" \
            --dry-run \
            --force

      - name: Run release helper tests
        run: |
          bun run ci:desktop:release-tests
          bun run --cwd scripts test -- desktop-media.test.ts

      - name: Audit public source, credentials, licenses, and branding
        run: |
          bun run public-source:check
          bun run brand:check

  runtime-smoke:
    name: Desktop runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Verify node-pty
        run: bun run ci:desktop:node-pty

      - name: Build desktop application
        run: bun run build:desktop

      - name: Verify built preload
        run: bun run ci:desktop:preload

      - name: Configure Electron sandbox on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          electron_sandbox=$(node --print "require('node:path').join(require('node:path').dirname(require('./apps/desktop/node_modules/electron')), 'chrome-sandbox')")
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"

      - name: Smoke-test Electron
        run: xvfb-run -a bun run test:desktop-smoke

      - name: Verify OpenCode remains externally installed
        run: bun run ci:desktop:no-bundled-opencode

  installed-opencode:
    name: Installed OpenCode compatibility (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package: opencode-linux-x64
          - runner: macos-15
            package: opencode-darwin-arm64
          - runner: macos-15-intel
            package: opencode-darwin-x64
          - runner: windows-2022
            package: opencode-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      # This isolated test dependency is never staged into the DJL application.
      - name: Install official CLI fixture
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/djl-installed-opencode" --ignore-scripts --no-save "${{ matrix.package }}@1.18.29"
          npm install --prefix "$RUNNER_TEMP/djl-opencode-config-deps" --ignore-scripts --save-exact --no-audit --no-fund "@opencode-ai/plugin@1.18.29"

      - name: Verify installed CLI compatibility
        shell: bash
        env:
          OPENCODE_FIXTURE_PACKAGE: ${{ matrix.package }}
          DJL_TEST_OPENCODE_DEPENDENCIES: ${{ runner.temp }}/djl-opencode-config-deps
          OPENCODE_DISABLE_MODELS_FETCH: "true"
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { join } from "node:path";
          import { inspectInstalledOpenCodeProtocol } from "./apps/server/src/provider/openCodeInstalledProtocol.ts";
          const binary = join(process.env.RUNNER_TEMP, "djl-installed-opencode", "node_modules", process.env.OPENCODE_FIXTURE_PACKAGE, "bin", process.platform === "win32" ? "opencode.exe" : "opencode");
          const protocol = await inspectInstalledOpenCodeProtocol(binary, "1.18.29");
          if (!protocol.compatible) throw new Error(protocol.compatibilityMessage);
          for (const [provider, format] of [["ollama", "json"], ["lmstudio", "tagged"], ["deepseek", "dsml"]]) {
            const result = spawnSync(process.execPath, ["scripts/probe-installed-opencode.ts", binary, "--compatibility", `--provider=${provider}`, `--format=${format}`], { stdio: "inherit" });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          for (const flags of [["--native-scope"], ["--no-tools"], ["--native-scope", "--no-tools"]]) {
            const result = spawnSync(process.execPath, ["scripts/probe-installed-opencode.ts", binary, "--compatibility", ...flags], { stdio: "inherit" });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          const integration = spawnSync("bun", ["run", "--cwd", "apps/server", "test", "--", "src/provider/openCodeInstalledAdapter.integration.test.ts", "src/provider/openCodeInstalledMigration.test.ts", "src/harnesses/openCodeCredentialTransfer.test.ts"], {
            stdio: "inherit",
            env: { ...process.env, DJL_TEST_OPENCODE_BINARY: binary },
          });
          if (integration.error) throw integration.error;
          if (integration.status !== 0) process.exit(integration.status ?? 1);
          NODE

  multipost-native:
    name: MultiPost native (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop
      - name: Verify MultiPost native publishing and recovery
        run: bun run --cwd apps/desktop test:multipost-lifecycle

  desktop-ci:
    name: desktop-ci
    if: always()
    needs:
      - quality
      - desktop-tests
      - renderer-tests
      - release-audit
      - runtime-smoke
      - installed-opencode
      - multipost-native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every desktop PR lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DESKTOP_TESTS_RESULT: ${{ needs.desktop-tests.result }}
          RENDERER_TESTS_RESULT: ${{ needs.renderer-tests.result }}
          RELEASE_AUDIT_RESULT: ${{ needs.release-audit.result }}
          RUNTIME_SMOKE_RESULT: ${{ needs.runtime-smoke.result }}
          INSTALLED_OPENCODE_RESULT: ${{ needs.installed-opencode.result }}
          MULTIPOST_NATIVE_RESULT: ${{ needs.multipost-native.result }}
        run: |
          set -euo pipefail
          for result in \
            "$QUALITY_RESULT" \
            "$DESKTOP_TESTS_RESULT" \
            "$RENDERER_TESTS_RESULT" \
            "$RELEASE_AUDIT_RESULT" \
            "$RUNTIME_SMOKE_RESULT" \
            "$INSTALLED_OPENCODE_RESULT" \
            "$MULTIPOST_NATIVE_RESULT"
          do
            [[ "$result" == "success" ]] || {
              echo "A required desktop CI lane finished with: $result" >&2
              exit 1
            }
          done

  package-smoke:
    name: Package smoke (${{ matrix.label }})
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: desktop-ci
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Azure login for Artifact Signing
        if: matrix.platform == 'win'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify native hardware recommendation
        shell: bash
        run: bun run --cwd apps/server test -- src/localModels/hardwareProfile.native.test.ts

      - name: Verify pinned native media tools
        shell: bash
        run: |
          bun scripts/stage-desktop-media.ts --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --root "$RUNNER_TEMP/djl-media-smoke"
          bun scripts/stage-desktop-media.ts --verify --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --root "$RUNNER_TEMP/djl-media-smoke"

      - name: Verify pinned Cua and AppSnap engine
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=1.97.1 node apps/desktop/scripts/provision-cua-driver.mjs --platform darwin --arch "${{ matrix.arch }}" --destination "$RUNNER_TEMP/djl-cua-smoke"
          echo "SYNARA_CUA_ARTIFACT_DIR=$RUNNER_TEMP/djl-cua-smoke" >> "$GITHUB_ENV"
          node apps/desktop/scripts/build-appsnap-helper.mjs --arch "${{ matrix.arch }}" --output "$RUNNER_TEMP/djl-appsnap-smoke"
          bun run --cwd apps/desktop test -- scripts/cua-artifact-provenance.test.mjs scripts/cua-cache-key.test.mjs src/cuaDriverHost.test.ts src/cuaHostSocket.test.ts src/cuaRuntimeOwnership.test.ts src/computerDesktopLifecycle.test.ts src/computerStopPresentation.test.ts src/computerUseProviderInterrupt.test.ts

      - name: Verify native computer-use helper
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          bun run --cwd scripts test -- stage-desktop-computer-use.test.ts
          bash apps/desktop/native/computer-use/test-human-control-guard.sh
          bash apps/desktop/native/computer-use/test-focus-routing-state.sh
          bash apps/desktop/native/computer-use/test-process-event-timestamp.sh
          bash apps/desktop/native/computer-use/test-app-local-focus-events.sh
          bash apps/desktop/native/computer-use/test-running-app-admission.sh
          bash apps/desktop/native/computer-use/test-application-scope-policy.sh
          bash apps/desktop/native/computer-use/test-process-generation.sh
          bash apps/desktop/native/computer-use/test-keyboard-target-policy.sh
          bash apps/desktop/native/computer-use/test-selection.sh
          bash apps/desktop/native/computer-use/test-activation-policies.sh
          bash apps/desktop/native/computer-use/test-element-action-geometry.sh
          bash apps/desktop/native/computer-use/test-clipboard-paste.sh
          bash apps/desktop/native/computer-use/test-paste-representations.sh
          bash apps/desktop/native/computer-use/test-interaction-history.sh
          bun scripts/stage-desktop-computer-use.ts --platform mac --arch "${{ matrix.arch }}" --root "$RUNNER_TEMP/djl-computer-use-smoke"
          bun scripts/stage-desktop-computer-use.ts --verify --platform mac --arch "${{ matrix.arch }}" --root "$RUNNER_TEMP/djl-computer-use-smoke"

      - name: Build native package
        shell: bash
        env:
          SMOKE_VERSION: 0.0.0-ci.${{ github.run_number }}
          DJL_DESKTOP_UPDATE_BASE_URL: https://djl-china-releases.oss-accelerate.aliyuncs.com/stable
          SYNARA_DESKTOP_UPDATE_REPOSITORY: Anthonysu798/DJL
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: Anthony Su
          AZURE_TRUSTED_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: djl-windows-release-prod
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: djl-release-signing-prod
          AZURE_TRUSTED_SIGNING_FILE_DIGEST: SHA256
          AZURE_TRUSTED_SIGNING_TIMESTAMP_DIGEST: SHA256
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: http://timestamp.acs.microsoft.com
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$SMOKE_VERSION"
            --output-dir package-smoke
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CSC_LINK CSC_KEY_PASSWORD
            args+=(--signed)
          else
            unset \
              AZURE_CLIENT_ID AZURE_TENANT_ID \
              AZURE_TRUSTED_SIGNING_PUBLISHER_NAME \
              AZURE_TRUSTED_SIGNING_ENDPOINT \
              AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME \
              AZURE_TRUSTED_SIGNING_ACCOUNT_NAME \
              AZURE_TRUSTED_SIGNING_FILE_DIGEST \
              AZURE_TRUSTED_SIGNING_TIMESTAMP_DIGEST \
              AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161
          fi
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Verify native Computer Stop window lifecycle
        if: matrix.platform == 'mac'
        shell: bash
        run: bun run --cwd apps/desktop test:computer-stop-lifecycle

      - name: Verify unsigned macOS package smoke
        if: matrix.platform == 'mac'
        shell: bash
        env:
          SMOKE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          set -euo pipefail
          dmg="package-smoke/DJL-${SMOKE_VERSION}-${{ matrix.arch }}.dmg"
          test -s "$dmg"
          mount_point="$RUNNER_TEMP/djl-package-smoke-${{ matrix.arch }}"
          mkdir "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" -quiet
          # Shared with the release workflow so bundle defects are caught here, on every push,
          # rather than mid-release after notarization has already been paid for.
          scripts/verify-macos-app-bundle.sh "$mount_point/DJL.app" "${{ matrix.arch }}"
          bun scripts/stage-desktop-computer-use.ts --verify --packaged --platform mac --arch "${{ matrix.arch }}" --root "$mount_point/DJL.app/Contents/Resources/native"

      - name: Verify signed and timestamped Windows package smoke
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SMOKE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          $installer = "package-smoke/DJL-$env:SMOKE_VERSION-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Missing Windows installer: $installer"
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") {
            throw "Windows package smoke must have a valid Authenticode signature; received $($signature.Status)."
          }
          if ($signature.SignerCertificate.Subject -notmatch '(^|, )CN=Anthony Su(,|$)') {
            throw "Unexpected Windows signer: $($signature.SignerCertificate.Subject)"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Windows package smoke is missing its RFC 3161 timestamp."
          }
