name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Check scoped formatting
        run: bun run ci:desktop:format

      - name: Lint desktop closure
        run: bun run ci:desktop:lint

      - name: Typecheck desktop closure
        run: bun run ci:desktop:typecheck

  desktop-tests:
    name: Desktop unit and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Run desktop unit and contract tests
        run: bun run ci:desktop:test

  renderer-tests:
    name: Chromium renderer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Install Chromium
        run: bun run --cwd apps/web test:browser:install

      - name: Run Chromium renderer tests
        run: bun run ci:desktop:browser

  release-audit:
    name: Release, security, and public-source audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Run release helper tests
        run: bun run ci:desktop:release-tests

      - name: Audit public source, credentials, licenses, and branding
        run: |
          bun run public-source:check
          bun run brand:check

  runtime-smoke:
    name: Desktop runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Verify node-pty
        run: bun run ci:desktop:node-pty

      - name: Build desktop application
        run: bun run build:desktop

      - name: Verify built preload
        run: bun run ci:desktop:preload

      - name: Smoke-test Electron
        run: xvfb-run -a bun run test:desktop-smoke

      - name: Verify embedded OpenCode runtime
        run: bun run ci:desktop:embedded-runtime

  desktop-ci:
    name: desktop-ci
    if: always()
    needs:
      - quality
      - desktop-tests
      - renderer-tests
      - release-audit
      - runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every desktop PR lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DESKTOP_TESTS_RESULT: ${{ needs.desktop-tests.result }}
          RENDERER_TESTS_RESULT: ${{ needs.renderer-tests.result }}
          RELEASE_AUDIT_RESULT: ${{ needs.release-audit.result }}
          RUNTIME_SMOKE_RESULT: ${{ needs.runtime-smoke.result }}
        run: |
          set -euo pipefail
          for result in \
            "$QUALITY_RESULT" \
            "$DESKTOP_TESTS_RESULT" \
            "$RENDERER_TESTS_RESULT" \
            "$RELEASE_AUDIT_RESULT" \
            "$RUNTIME_SMOKE_RESULT"
          do
            [[ "$result" == "success" ]] || {
              echo "A required desktop CI lane finished with: $result" >&2
              exit 1
            }
          done

  package-smoke:
    name: Package smoke (${{ matrix.label }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: desktop-ci
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install frozen dependencies
        uses: ./.github/actions/setup-desktop

      - name: Verify native hardware recommendation
        shell: bash
        run: bun run --cwd apps/server test -- src/localModels/hardwareProfile.native.test.ts

      - name: Build unsigned native package
        shell: bash
        env:
          SMOKE_VERSION: 0.0.0-ci.${{ github.run_number }}
          SYNARA_DESKTOP_UPDATE_REPOSITORY: Anthonysu798/DJL
        run: |
          set -euo pipefail
          unset \
            APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER \
            CSC_LINK CSC_KEY_PASSWORD \
            AZURE_TRUSTED_SIGNING_PUBLISHER_NAME \
            AZURE_TRUSTED_SIGNING_ENDPOINT \
            AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME \
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME \
            AZURE_TRUSTED_SIGNING_FILE_DIGEST \
            AZURE_TRUSTED_SIGNING_TIMESTAMP_DIGEST \
            AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bun run dist:desktop:artifact -- \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "$SMOKE_VERSION" \
            --output-dir package-smoke \
            --verbose

      - name: Verify unsigned macOS package smoke
        if: matrix.platform == 'mac'
        shell: bash
        env:
          SMOKE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          set -euo pipefail
          dmg="package-smoke/DJL-${SMOKE_VERSION}-${{ matrix.arch }}.dmg"
          test -s "$dmg"
          mount_point="$RUNNER_TEMP/djl-package-smoke-${{ matrix.arch }}"
          mkdir "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" -quiet
          # Shared with the release workflow so bundle defects are caught here, on every push,
          # rather than mid-release after notarization has already been paid for.
          scripts/verify-macos-app-bundle.sh "$mount_point/DJL.app" "${{ matrix.arch }}"

      - name: Verify unsigned Windows package smoke
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SMOKE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          $installer = "package-smoke/DJL-$env:SMOKE_VERSION-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Missing Windows installer: $installer"
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "NotSigned") {
            throw "Windows package smoke must be unsigned; received $($signature.Status)."
          }
