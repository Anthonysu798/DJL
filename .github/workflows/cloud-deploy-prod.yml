name: Cloud deploy production

# Backend releases use their own `cloud-v*` tags. Plain `v*` tags belong to
# the desktop release (desktop-release.yml) and must never deploy the backend.
on:
  push:
    tags: ["cloud-v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag commit is green on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor HEAD origin/main || { echo "tag is not on main"; exit 1; }
      - name: Require a successful Cloud CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow "Cloud CI" --commit "$(git rev-parse HEAD)" --json conclusion --jq '.[0].conclusion // "none"')
          test "$conclusion" = "success" || { echo "Cloud CI for this commit is $conclusion"; exit 1; }

  deploy:
    name: Migrate and deploy production
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The `production` environment requires a manual approval in GitHub before this job runs.
    environment: production
    env:
      VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.PROD_VPS_KNOWN_HOSTS }}
      VPS_ROOT: /srv/djl-cloud-production
      DJL_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Back up, migrate, deploy, and verify VPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash cloud/infra/vps/deploy.sh
