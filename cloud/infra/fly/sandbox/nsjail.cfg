# nsjail policy for every piece of user code and every document parse.
# Fresh user, pid, mount, ipc, uts, cgroup, and network namespaces: the jail
# has no network interfaces at all. The root is empty apart from read-only
# binds of the runtime; only /work (tmpfs, per machine) and /tmp are writable.
name: "djl-sandbox"
mode: ONCE
hostname: "sandbox"
log_level: ERROR
cwd: "/work"
time_limit: 60
max_cpus: 1

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/work"
envar: "MPLBACKEND=Agg"
envar: "MPLCONFIGDIR=/tmp"
envar: "PYTHONDONTWRITEBYTECODE=1"

uidmap { inside_id: "65534" outside_id: "65534" }
gidmap { inside_id: "65534" outside_id: "65534" }

rlimit_as: 1024
rlimit_cpu: 60
rlimit_fsize: 64
rlimit_nofile: 64
rlimit_nproc: 32
rlimit_core: 0

mount { src: "/usr" dst: "/usr" is_bind: true }
mount { src: "/lib" dst: "/lib" is_bind: true }
mount { src: "/lib64" dst: "/lib64" is_bind: true mandatory: false }
mount { src: "/bin" dst: "/bin" is_bind: true }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true mandatory: false }
mount { src: "/opt/djl" dst: "/opt/djl" is_bind: true }
mount { src: "/work" dst: "/work" is_bind: true rw: true }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size=64m" }
mount { dst: "/proc" fstype: "proc" }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true }

# Deny the syscalls a jailbreak or a kernel probe would need.
seccomp_string: "ERRNO(1) {"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, mount, umount2, pivot_root,"
seccomp_string: "  swapon, swapoff, reboot, kexec_load, kexec_file_load, init_module,"
seccomp_string: "  finit_module, delete_module, bpf, perf_event_open, keyctl, add_key,"
seccomp_string: "  request_key, unshare, setns, userfaultfd, personality, acct, quotactl"
seccomp_string: "}"
seccomp_string: "DEFAULT ALLOW"
