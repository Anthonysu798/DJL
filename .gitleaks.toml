[extend]
useDefault = true

# Checkout idempotency UUIDs identify synthetic requests, not credentials.
[[allowlists]]
description = "DJL Shop synthetic idempotency UUID fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^cloud/apps/web/lib/commerce-api\.test\.ts$''',
  '''^cloud/apps/api/src/commerce/CommerceService\.test\.ts$''',
]
regexes = ['''\bidempotencyKey\s*[:=]\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"''']

# These first-party matches are identifiers or keyboard shortcuts, not stored credentials.
[[allowlists]]
description = "DJL credential type names, pairing alphabet, and keybinding fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^apps/ios/DJL/Services/CodexSecureTransportModels\.swift$''',
  '''^apps/server/src/auth/Layers/BootstrapCredentialService\.ts$''',
  '''^apps/server/src/keybindings\.ts$''',
]
regexes = [
  '''phoneEphemeralPrivateKey:\s+Curve25519\.KeyAgreement\.PrivateKey''',
  '''PAIRING_TOKEN_ALPHABET\s*=''',
  '''key:\s*"mod\+shift\+arrow(?:left|right|up|down)"''',
]

# OpenCode retains synthetic secret-detection fixtures and non-secret public client identifiers.
[[allowlists]]
description = "Vendored OpenCode documentation and UI fixture identifiers"
condition = "AND"
targetRules = ["curl-auth-header", "generic-api-key"]
regexTarget = "line"
paths = [
  '''^vendor/opencode/packages/docs/ai-tools/cursor\.mdx$''',
  '''^vendor/opencode/packages/app/e2e/performance/timeline-stability/context-matrix\.spec\.ts$''',
  '''^vendor/opencode/packages/app/src/pages/layout\.tsx$''',
  '''^vendor/opencode/packages/sdk/js/src/v2/gen/sdk\.gen\.ts$''',
]
regexes = [
  '''Authorization:\s+Bearer\s+YOUR_API_KEY''',
  '''const ids = \["prt_key_01_read"''',
  '''keybind:\s*"shift\+alt\+arrow(?:up|down)"''',
  '''key:\s*"questionV2Reply"''',
]

[[allowlists]]
description = "Vendored OpenCode recorder tests intentionally contain synthetic secret shapes"
condition = "AND"
targetRules = ["gcp-api-key", "generic-api-key"]
regexTarget = "line"
paths = ['''^vendor/opencode/packages/http-recorder/test/record-replay\.test\.ts$''']
regexes = [
  '''example\.test/path\?key=sk-[0-9]+''',
  '''nested:\s*"AIza[A-Za-z0-9_-]+"''',
  '''token:\s*"sk-[0-9]+"''',
]

[[allowlists]]
description = "Vendored OpenCode public OAuth and Stripe client identifiers"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^vendor/opencode/packages/console/app/package\.json$''',
  '''^vendor/opencode/packages/opencode/src/plugin/digitalocean\.ts$''',
]
regexes = [
  '''VITE_STRIPE_PUBLISHABLE_KEY=pk_test_''',
  '''const DO_OAUTH_CLIENT_ID\s*=''',
]

# GitHub device flow needs only the OAuth App's client id, which is public; DJL has no client secret.
[[allowlists]]
description = "DJL GitHub OAuth App public client identifier"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''^apps/server/src/plugins/hostedPlugins\.ts$''']
regexes = ['''const GITHUB_OAUTH_CLIENT_ID = "Ov23li[A-Za-z0-9]{14}";''']

# DJL Cloud admin e2e tests use fixed throwaway passwords for test-only accounts.
[[allowlists]]
description = "DJL Cloud admin e2e test fixture passwords"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''^(cloud/)?apps/api/src/admin/admin\.e2e\.test\.ts$''']
regexes = ['''goodPassword\s*=\s*"employee-strong-passphrase-42"''']

# DJL Cloud contract fixtures and iOS client tests use synthetic tokens: a "ChangeMe" CSRF value,
# an unsigned JWT for user_1 ("sig"), and a hex APNs device token.
[[allowlists]]
description = "DJL Cloud synthetic contract and client test tokens"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^packages/contracts/fixtures/cloud/(csrf|access-token)\.json$''',
  '''^packages/contracts/src/cloud/fixtures\.ts$''',
  '''^apps/ios/DJLTests/CloudAPIClientTests\.swift$''',
]
regexes = [
  '''"Q2hhbmdlTWVDaGFuZ2VNZUNoYW5nZU1lQ2hhbmdlTWU"''',
  '''"eyJhbGciOiJFZERTQSJ9\.eyJzdWIiOiJ1c2VyXzEiLCJzaWQiOiJzZXNzXzEifQ\.c2ln"''',
  '''"abcdef0123456789abcdef0123456789"''',
]

# Public checksums and reproducible, non-credential protocol test vectors.
[[allowlists]]
description = "Flutter fixture hashes and deterministic pairing vectors"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^apps/mobile/ios/Podfile\.lock$''',
  '''^apps/mobile/integration_test/native/status_source_hashes\.json$''',
  '''^apps/mobile/test/fixtures/remote-v2\.json$''',
]
regexes = [
  '''^\s*(AppAuth|GTMAppAuth|local_auth_darwin): [a-f0-9]{40}$''',
  '''^\s*"[^"]+\.(?:dart|swift|kt|plist|yaml|xml|gradle|kts)": "[a-f0-9]{64}",?$''',
  '''^\s*"(?:sharedSecret|phoneToMacKey|macToPhoneKey)": "[A-Za-z0-9+/]{43}="[,]?$''',
]

[[allowlists]]
description = "DJL field names, cipher algorithm, and dummy redaction marker"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^apps/mobile/lib/features/reasoning/domain/desktop_reasoning\.dart$''',
  '''^apps/mobile/test/core/platform_credential_store_test\.dart$''',
  '''^apps/desktop/native/computer-use/Tests/native-history-host-e2e\.ts$''',
]
regexes = [
  '''='_djlReasoningV1'|= '_djlReasoningV1';''',
  '''RSA_ECB_OAEPwithSHA_256andMGF1Padding''',
  '''secret=synthetic-secret-123''',
]
