<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Mask shape for the SVG mask effect: a soft-edged disc. The component scales this via
       [mask-size], so only the silhouette matters, not the intrinsic size. -->
  <defs>
    <radialGradient id="soft" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#fff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#soft)" />
</svg>
